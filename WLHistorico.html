<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Weekend League — Histórico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="WL.css">
<link rel="manifest" href="manifest.json">
<script type="module" src="firebase-sync.js"></script>
<meta name="theme-color" content="#A6192E">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fifa Legends">
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <a href="WL.html" class="topbar-back">← Weekend League</a>
    <div class="topbar-actions">
      <a href="WLStats.html" class="topbar-icon-btn" title="Estatísticas dos Jogadores">📊</a>
    </div>
  </header>

  <div class="page-head">
    <h1>Histórico de WLs</h1>
    <p class="sub">Resumo geral e detalhes de cada Weekend League registrada</p>
  </div>

  <div class="content">

  <section class="panel">
    <h2>🔍 Filtros</h2>
    <div class="formation-setup">
      <div class="field">
        <label for="historicoFilterEdition">Edição</label>
        <select id="historicoFilterEdition">
          <option value="">Todas as edições</option>
          <option value="fifa22">FIFA 22</option>
          <option value="fifa23">FIFA 23</option>
          <option value="fc26">EA FC 26</option>
          <option value="fc27">EA FC 27</option>
        </select>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>📊 Resumo Geral</h2>
    <div class="summary-grid" id="summaryGrid"></div>
  </section>

  <section class="panel">
    <h2>📼 Ver uma WL específica</h2>
    <select id="wlPickerSelect" style="width:100%; margin-bottom:14px;"></select>
    <div id="wlPickerDetail"></div>
  </section>

  </div>

  <nav class="bottom-nav">
    <a href="Fifa.html"><span class="nav-ic">👤</span>Jogadores</a>
    <a href="WL.html"><span class="nav-ic">⚔️</span>Weekend League</a>
    <a href="WLStats.html"><span class="nav-ic">📊</span>Estatísticas</a>
    <a href="WLHistorico.html" class="active"><span class="nav-ic">🏆</span>Histórico</a>
  </nav>

</div>

<script src="WLHistorico.js"></script>
<script src="pwa-register.js"></script>
</body>
</html>
